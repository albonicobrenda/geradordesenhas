<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg.png" alt="">
            <h2 class="titulo-principal">Gerador de senha</h2>
            <h3 class="titulo-secundario">Gere istantaneamente uma senha aleatoria e segura</h3>
        </div>
        <div class="conteudo-senha">
            <label for="senha">Senha</label>
            <input name="Senha" type="text" id="campo-senha" readonly>
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parameto-senha__tiulo">Numero de Caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>

                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Caracteristicas da senha</h4>
                    <div class="parametro-senha-checkbox">
                        <input name="maiusculo" type="checkbox" class="checkbox" checked>
                        <label for="maisculos">Letras Maiusculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="minusculo" type="checkbox" checkbox>
                        <label for="minusculo">Letras Minusculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="numero" type="checkbox" class="checkbox" checked>
                        <label for="numero">Numero</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="simbolo" type="checkbox" class="checkbox" checked>
                        <label for="simbolo">Simbolos</label>
                    </div>
                </div>
                <div class="parametro-senha">
                   <h4 class="parametro-senha__titulo">Força da senha</h4>
                   <div class="barra"></div>
                   <div class="forca fraca"></div>
                   <div class="parametro-senha-textos">
                    <p>Fraca</p>
                    <p>Média</p>
                    <p>Forte</p>
                   </div>
                   <p class="entropia"></p>
                </div>
            </div>
        </div>
    </section>
    <script src="main.js"></script>

</body>
</html>
